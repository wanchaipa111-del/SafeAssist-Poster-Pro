<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with gradient -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Building & Real Estate Icon -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Center Tower -->
    <path d="M192 112 h128 a12 12 0 0 1 12 12 v276 h-152 v-276 a12 12 0 0 1 12 -12 z" />
    
    <!-- Left Wing -->
    <path d="M104 200 h72 v200 h-72 a12 12 0 0 1 -12 -12 v-176 a12 12 0 0 1 12 -12 z" fill-opacity="0.9" />

    <!-- Right Wing -->
    <path d="M336 240 h72 a12 12 0 0 1 12 12 v136 a12 12 0 0 1 -12 12 h-72 z" fill-opacity="0.85" />

    <!-- Base Floor -->
    <rect x="72" y="392" width="368" height="24" rx="6" />

    <!-- Tower Windows -->
    <rect x="220" y="148" width="28" height="28" rx="6" fill="#0284c7" />
    <rect x="264" y="148" width="28" height="28" rx="6" fill="#0284c7" />
    <rect x="220" y="196" width="28" height="28" rx="6" fill="#0284c7" />
    <rect x="264" y="196" width="28" height="28" rx="6" fill="#0284c7" />
    <rect x="220" y="244" width="28" height="28" rx="6" fill="#0284c7" />
    <rect x="264" y="244" width="28" height="28" rx="6" fill="#0284c7" />
    <rect x="220" y="292" width="28" height="28" rx="6" fill="#0284c7" />
    <rect x="264" y="292" width="28" height="28" rx="6" fill="#0284c7" />

    <!-- Left Wing Windows -->
    <rect x="124" y="236" width="24" height="24" rx="5" fill="#0284c7" />
    <rect x="124" y="280" width="24" height="24" rx="5" fill="#0284c7" />
    <rect x="124" y="324" width="24" height="24" rx="5" fill="#0284c7" />

    <!-- Right Wing Windows -->
    <rect x="364" y="272" width="24" height="24" rx="5" fill="#0284c7" />
    <rect x="364" y="316" width="24" height="24" rx="5" fill="#0284c7" />

    <!-- Door / Entrance -->
    <path d="M236 348 h40 v44 h-40 z" fill="#0369a1" />
  </g>

  <!-- Green Shield / Verified Check Badge -->
  <g filter="url(#shadow)">
    <!-- Badge Background Circle -->
    <circle cx="376" cy="376" r="68" fill="#10b981" stroke="#ffffff" stroke-width="10" />
    <!-- Checkmark -->
    <path d="M344 374 l22 22 l46 -46" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
